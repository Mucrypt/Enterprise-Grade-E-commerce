server {
  listen 80;
  server_name techtoolstore.com www.techtoolstore.com;

  # Certbot ACME challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name techtoolstore.com www.techtoolstore.com;

  ssl_certificate /etc/letsencrypt/live/techtoolstore.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/techtoolstore.com/privkey.pem;

  # Modern TLS
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # HSTS (Strict-Transport-Security) - Force HTTPS and prevent downgrade attacks
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  
  # Additional security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  # media-src: governs <video>/<audio> src loading, separate from img-src
  # under CSP -- without it explicitly set, it falls back to default-src
  # 'self' and silently blocks any video/audio not served from this same
  # origin. Real gap: Discover feed video/audio is served from Cloudinary
  # (res.cloudinary.com) when MEDIA_STORAGE_PROVIDER=cloudinary, not from
  # techtoolstore.com itself -- every such post failed with "This video
  # couldn't be played" (the real, honest error the frontend shows on a
  # genuine failure) even though the file itself was fine. Scoped as
  # broadly as img-src already is (https: + blob:) rather than pinned to
  # one CDN host, since MEDIA_STORAGE_PROVIDER can also be r2/local.
  #
  # connect-src additionally needs res.cloudinary.com: hls.js (Discover's
  # adaptive-bitrate player) fetches .m3u8 manifests and segments via
  # XHR/fetch, not a <video src> the browser loads natively -- that
  # traffic is governed by connect-src, not media-src, so posters/videos
  # rendered fine here while hls.js and the next-slide prefetch both hit
  # a silent CSP block. Kept pinned to the one real CDN host (unlike
  # media-src's broader https:) since connect-src also gates fetch/XHR/
  # WebSocket -- the higher-risk directive for XSS-driven exfiltration,
  # worth the extra edit if MEDIA_STORAGE_PROVIDER ever changes.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tawk.to https://embed.tawk.to https://js.stripe.com https://*.stripe.com; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tawk.to https://embed.tawk.to https://js.stripe.com https://*.stripe.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://techtoolstore.com wss://techtoolstore.com https://res.cloudinary.com https://*.tawk.to wss://*.tawk.to https://js.stripe.com https://api.stripe.com https://r.stripe.com https://m.stripe.network https://*.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.tawk.to;" always;

  # Global rate limiting
  limit_conn conn_limit 20;

  # nginx's own default is 1MB -- far below what the API itself allows
  # (MAX_VIDEO_SIZE defaults to 100MB, see tech-tools-api/src/utils/
  # media.ts). Every Discover video upload was being rejected here,
  # before the request ever reached the Node process at all -- confirmed
  # live: the API's own logs showed zero activity for the upload attempt,
  # and the browser saw a 502 followed by the client's own 120s timeout
  # (nginx closing the connection mid-upload rather than a clean 413).
  # Set generously above the API's own limit, not tightly matched to it,
  # so this file doesn't need editing again the next time that env var
  # changes.
  client_max_body_size 150m;

  # Marketplace (primary)
  location / {
    proxy_pass http://web_store_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
  }

  # Admin dashboard - match both /admin and /admin/...
  location /admin {
    proxy_pass http://admin_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
  }

  # pgAdmin is intentionally private. Access only via SSH tunnel to localhost:5050.
  location /pgadmin {
    return 404;
  }

  # API endpoints
  # burst was 20 -- a single real page load now legitimately fans out into
  # 20-30+ concurrent /api/ calls (categories, brands, hero slides,
  # multiple collections, per-brand product rows, brand stats, etc., see
  # this session's real-data features), so a normal page load alone could
  # exhaust the burst bucket and get 503'd by nginx itself before ever
  # reaching the API. Raised to comfortably cover that plus headroom for
  # fast navigation between pages; the steady-state rate=100r/m below is
  # unchanged, so sustained abuse/scraping is still throttled the same.
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    
    # Do not rewrite paths; external URLs use /api/v1/* already
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    # 60s was fine for ordinary JSON API calls but too short for the
    # actual upload transfer of a large Discover video/audio file --
    # proxy_send_timeout is nginx's own time limit for sending the
    # request body to the upstream, which for a big multipart upload on
    # a slow connection can legitimately take longer than a minute even
    # though the API itself now responds fast once the file has arrived
    # (video processing runs in the background, see discover.controller.
    # ts's processDeferredMediaInBackground -- this is purely about the
    # upload transfer time, not processing time).
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # WebSocket (Socket.IO) for real-time admin dashboard metrics.
  # Must be a distinct block from /api/ -- that block clears the Connection
  # header (Connection ""), which breaks the WebSocket upgrade handshake.
  location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  # Auth endpoints (stricter rate limit - 5 req/min + 2 burst = very strict)
  location ~ ^/api/v1/auth/(login|register) {
    limit_req zone=auth_limit burst=2 nodelay;
    
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media files
  location /media/ {
    proxy_pass http://api_backend/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    
    # Cache media files
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 10m;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Health check
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
