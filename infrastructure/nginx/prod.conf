server {
  listen 80;
  server_name techtoolstore.com www.techtoolstore.com;

  # Certbot ACME challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name techtoolstore.com www.techtoolstore.com;

  ssl_certificate /etc/letsencrypt/live/techtoolstore.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/techtoolstore.com/privkey.pem;

  # Modern TLS
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # HSTS (Strict-Transport-Security) - Force HTTPS and prevent downgrade attacks
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  
  # Additional security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tawk.to https://embed.tawk.to https://js.stripe.com https://*.stripe.com; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tawk.to https://embed.tawk.to https://js.stripe.com https://*.stripe.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://techtoolstore.com wss://techtoolstore.com https://*.tawk.to wss://*.tawk.to https://js.stripe.com https://api.stripe.com https://r.stripe.com https://m.stripe.network https://*.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.tawk.to;" always;

  # Global rate limiting
  limit_conn conn_limit 20;

  # Marketplace (primary)
  location / {
    proxy_pass http://web_store_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
  }

  # Admin dashboard - match both /admin and /admin/...
  location /admin {
    proxy_pass http://admin_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
  }

  # pgAdmin is intentionally private. Access only via SSH tunnel to localhost:5050.
  location /pgadmin {
    return 404;
  }

  # API endpoints
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    
    # Do not rewrite paths; external URLs use /api/v1/* already
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Auth endpoints (stricter rate limit - 5 req/min + 2 burst = very strict)
  location ~ ^/api/v1/auth/(login|register) {
    limit_req zone=auth_limit burst=2 nodelay;
    
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media files
  location /media/ {
    proxy_pass http://api_backend/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    
    # Cache media files
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 10m;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Health check
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
