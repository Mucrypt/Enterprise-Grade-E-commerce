services:
  postgres:
    image: postgres:15-alpine
    container_name: techtools-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../tech-tools-api/backups:/backups
      - ../tech-tools-api/src/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - techtools-prod-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: techtools-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - techtools-prod-network
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: ../tech-tools-api
      dockerfile: Dockerfile
    container_name: techtools-api-prod
    environment:
      NODE_ENV: production
      PORT: 9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://techtoolstore.com,https://www.techtoolstore.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-5.5}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ENABLE_BOOKS_WEB3: ${ENABLE_BOOKS_WEB3:-false}
      BOOKS_MARKETPLACE_ENABLED: ${BOOKS_MARKETPLACE_ENABLED:-false}
      CREATOR_PORTAL_ENABLED: ${CREATOR_PORTAL_ENABLED:-false}
      DIGITAL_LIBRARY_ENABLED: ${DIGITAL_LIBRARY_ENABLED:-false}
    volumes:
      - api_uploads:/app/uploads
    networks:
      - techtools-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/admin}
        NEXT_PUBLIC_TAWK_SITE_ID: ${NEXT_PUBLIC_TAWK_SITE_ID}
        NEXT_PUBLIC_TAWK_WIDGET_ID: ${NEXT_PUBLIC_TAWK_WIDGET_ID:-1jm6uk6rp}
    container_name: techtools-admin-dashboard-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/admin}
      NEXT_PUBLIC_TAWK_SITE_ID: ${NEXT_PUBLIC_TAWK_SITE_ID}
      NEXT_PUBLIC_TAWK_WIDGET_ID: ${NEXT_PUBLIC_TAWK_WIDGET_ID:-1jm6uk6rp}
      API_INTERNAL_URL: http://api:9000/api/v1
    networks:
      - techtools-prod-network
    depends_on:
      - api
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/admin/',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-store:
    build:
      context: ../e-commerce-web-store
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MEDIA_URL: ${VITE_MEDIA_URL}
        VITE_TAWK_SITE_ID: ${VITE_TAWK_SITE_ID}
        VITE_TAWK_WIDGET_ID: ${VITE_TAWK_WIDGET_ID:-1jm6uk6rp}
    container_name: techtools-web-store-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
      VITE_MEDIA_URL: ${VITE_MEDIA_URL}
      VITE_TAWK_SITE_ID: ${VITE_TAWK_SITE_ID}
      VITE_TAWK_WIDGET_ID: ${VITE_TAWK_WIDGET_ID:-1jm6uk6rp}
    networks:
      - techtools-prod-network
    depends_on:
      - api
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: techtools-nginx-prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../tech-tools-api/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - techtools-prod-network
    depends_on:
      - api
      - admin-dashboard
      - web-store
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    command: >
      /bin/sh -c '
        set -e;
        if [ ! -f /etc/letsencrypt/live/techtoolstore.com/fullchain.pem ]; then
          echo "[nginx] No LetsEncrypt cert found for techtoolstore.com; creating temporary self-signed cert";
          apk add --no-cache openssl >/dev/null;
          mkdir -p /etc/letsencrypt/live/techtoolstore.com;
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/techtoolstore.com/privkey.pem \
            -out /etc/letsencrypt/live/techtoolstore.com/fullchain.pem \
            -subj "/CN=techtoolstore.com";
        fi;
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        nginx -g "daemon off;"'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: techtools-pgadmin-prod
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - '127.0.0.1:5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - techtools-prod-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  certbot:
    image: certbot/certbot
    container_name: techtools-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - techtools-prod-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

networks:
  techtools-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  nginx_logs:
  certbot_conf:
  certbot_www:
  pgadmin_data:
  api_uploads:
