services:
  postgres:
    image: postgres:15-alpine
    container_name: techtools-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-techtools}
      POSTGRES_USER: ${DB_USER:-techtools_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../tech-tools-api/src/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - techtools-dev-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-techtools_user} -d ${DB_NAME:-techtools}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: techtools-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_dev_data:/data
    networks:
      - techtools-dev-network
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.12
    container_name: techtools-pgadmin-dev
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@techtools.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGPASSFILE: /pgadmin4/pgpass
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    networks:
      - techtools-dev-network
    depends_on:
      - postgres
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: techtools-redis-commander-dev
    ports:
      - '8081:8081'
    environment:
      REDIS_HOSTS: local:redis:6379${REDIS_PASSWORD:+:0:${REDIS_PASSWORD}}
    networks:
      - techtools-dev-network
    depends_on:
      - redis
    restart: unless-stopped

  api:
    build:
      context: ../tech-tools-api
      dockerfile: Dockerfile.dev
    container_name: techtools-api-dev
    ports:
      - '${PORT:-9000}:9000'
    environment:
      NODE_ENV: development
      PORT: 9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-techtools}
      DB_USER: ${DB_USER:-techtools_user}
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-this-too}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:5173,http://localhost:8080}
    volumes:
      - ../tech-tools-api/src:/app/src
      - ../tech-tools-api/scripts:/app/scripts
      - ../tech-tools-api/package.json:/app/package.json
      - ../tech-tools-api/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    networks:
      - techtools-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile.dev
    container_name: techtools-admin-dashboard-dev
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_MEDIA_URL: http://localhost:8080/media
      API_INTERNAL_URL: http://api:9000/api/v1
      NEXT_PUBLIC_BASE_PATH: /admin
      WATCHPACK_POLLING: 'true'
    volumes:
      - ../admin-dashboard:/app
      - /app/node_modules
      - /app/.next
    networks:
      - techtools-dev-network
    depends_on:
      - api
    restart: unless-stopped

  web-store:
    build:
      context: ../e-commerce-web-store
      dockerfile: Dockerfile.dev
    container_name: techtools-web-store-dev
    ports:
      - '5173:5173'
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:9000/api/v1
      VITE_MEDIA_URL: http://localhost:9000/media
    volumes:
      - ../e-commerce-web-store:/app
      - /app/node_modules
    networks:
      - techtools-dev-network
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: techtools-dev-nginx
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - techtools-dev-network
    depends_on:
      - api
      - admin-dashboard
      - web-store
      - pgadmin
      - redis-commander
    restart: unless-stopped

networks:
  techtools-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_dev_data:
