name: Mobile App CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tech-tools-mobile-app/**'
      - '.github/workflows/mobile-app-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tech-tools-mobile-app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - preview
          - production
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - both

defaults:
  run:
    working-directory: tech-tools-mobile-app

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

concurrency:
  group: mobile-cicd-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Lint and Type Check
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tech-tools-mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true

  # ==========================================
  # EAS Update (OTA - Over-The-Air Updates)
  # For JS/asset changes only - Instant deployment!
  # ==========================================
  eas-update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest
    needs: lint
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'update')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tech-tools-mobile-app/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA Update
        run: |
          eas update --branch preview --message "Update from commit ${{ github.sha }}"

  # ==========================================
  # Preview Build (APK for internal testing)
  # ==========================================
  preview-build:
    name: Preview Build (APK)
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'preview'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tech-tools-mobile-app/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Preview APK
        run: eas build --platform android --profile preview --non-interactive

  # ==========================================
  # Production Build & Submit to Play Store
  # ==========================================
  production-build:
    name: Production Build & Submit
    runs-on: ubuntu-latest
    needs: lint
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'production' && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tech-tools-mobile-app/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create Google Service Account Key
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: Build Production AAB
        run: eas build --platform android --profile production --non-interactive --auto-submit

      - name: Cleanup Service Account Key
        if: always()
        run: rm -f google-service-account.json

  # ==========================================
  # iOS Production Build & Submit to App Store Connect
  # Manual trigger only for safer live operations
  # ==========================================
  production-ios-build:
    name: Production iOS Build & Submit
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_type == 'production' &&
      (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tech-tools-mobile-app/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and Submit iOS
        run: eas build --platform ios --profile production --non-interactive --auto-submit

  # ==========================================
  # Build Only (No Submit) - Manual Trigger
  # ==========================================
  production-build-only:
    name: Production Build (No Submit)
    runs-on: ubuntu-latest
    needs: lint
    if: false # Enable by changing to: github.event_name == 'workflow_dispatch' && ...
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Production AAB
        run: eas build --platform android --profile production --non-interactive
