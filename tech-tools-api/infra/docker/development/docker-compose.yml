services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: techtools-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-techtools}
      POSTGRES_USER: ${DB_USER:-techtools_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../../database/init:/docker-entrypoint-initdb.d
      - ../../../src/database/migrations:/migrations
    networks:
      - techtools-dev-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-techtools_user} -d ${DB_NAME:-techtools}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis for Caching & Sessions
  redis:
    image: redis:7-alpine
    container_name: techtools-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - techtools-dev-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis Commander (UI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: techtools-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD:
    ports:
      - '8081:8081'
    networks:
      - techtools-dev-network
    depends_on:
      - redis
    restart: unless-stopped

  # PgAdmin4 (Professional UI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: techtools-pgadmin4-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@techtools.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin123!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # Enable all professional features
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_LOGIN_BANNER: '"TechTools API - PostgreSQL Management"'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: '10'
      PGADMIN_CONFIG_FILE_LOG_LEVEL: '10'
      # Query tool features
      PGADMIN_CONFIG_MAX_QUERY_HIST_STORED: '100'
      PGADMIN_CONFIG_ALLOW_SAVE_PASSWORD: 'True'
      # Email validation bypass
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: 'False'
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local", "localhost"]'
      # Auto-discover database
      PGADMIN_SETUP_EMAIL: ${PGADMIN_EMAIL:-admin@techtools.com}
      PGADMIN_SETUP_PASSWORD: ${PGADMIN_PASSWORD:-Admin123!}
      # Connection settings
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_LISTEN_ADDRESS: '0.0.0.0'
    ports:
      - '8080:80'
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    networks:
      - techtools-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service (Development)
  api:
    build:
      context: ../../..
      dockerfile: infra/docker/development/Dockerfile
    container_name: techtools-api-dev
    environment:
      NODE_ENV: development
      PORT: 9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-techtools}
      DB_USER: ${DB_USER:-techtools_user}
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-this-too}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3001}
    ports:
      - '9000:9000'
    volumes:
      - ../../../:/app
      - /app/node_modules
    networks:
      - techtools-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy (Development)
  nginx:
    image: nginx:alpine
    container_name: techtools-nginx-dev
    ports:
      - '80:80'
    volumes:
      - ../../nginx/development/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/development/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - techtools-dev-network
    depends_on:
      - api
    restart: unless-stopped

networks:
  techtools-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_dev_data:
