version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: techtools-postgres
    environment:
      POSTGRES_DB: techtools
      POSTGRES_USER: techtools_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - techtools-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techtools_user']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: techtools-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - techtools-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Commander (UI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: techtools-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    networks:
      - techtools-network
    depends_on:
      - redis

  # PgAdmin (UI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: techtools-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techtools.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin123!}
    ports:
      - '8080:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - techtools-network
    depends_on:
      - postgres

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: techtools-api
    ports:
      - '9000:9000'
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: techtools
      DB_USER: techtools_user
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key}
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    networks:
      - techtools-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

networks:
  techtools-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
