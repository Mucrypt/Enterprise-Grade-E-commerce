server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached -- it's the one file that has to be
  # revalidated on every request so a returning browser picks up the
  # CURRENT content-hashed chunk filenames. Without this, no explicit
  # Cache-Control means browsers may heuristically cache it anyway
  # (based on Last-Modified), so a plain refresh after a deploy can still
  # serve a stale index.html referencing chunk files that no longer
  # exist on disk (the old container is gone, not just its cache entry)
  # -- confirmed live: "Failed to fetch dynamically imported module" on
  # /profile for a tab that was open across a deploy. This location
  # block is reached both for direct /index.html requests and via the
  # try_files fallback below (nginx re-runs location matching on that
  # internal redirect), so it covers every route.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
