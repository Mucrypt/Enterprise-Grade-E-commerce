<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="techtools-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#F4511E"/>
      <stop offset="100%" style="stop-color:#E53935"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#techtools-gradient)"/>
  <!-- Inner highlight -->
  <rect x="24" y="24" width="464" height="232" rx="72" fill="white" fill-opacity="0.15"/>
  <!-- Letter T with shadow -->
  <g filter="url(#shadow)">
    <text x="256" y="380" font-family="Arial Black, Arial, sans-serif" font-size="340" font-weight="900" fill="white" text-anchor="middle">T</text>
  </g>
</svg>
